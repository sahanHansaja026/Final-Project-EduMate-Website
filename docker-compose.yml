version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edumate-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/edumate?sslmode=disable
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: edumate-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./client:/app

  db:
    image: postgres:15
    container_name: edumate-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: edumate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: edumate-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edumate.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  pgdata: