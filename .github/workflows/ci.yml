name: EduMate CI

# The repository's default branch is currently spelled "deveopment".
# Pull requests are validated regardless of their target branch.
on:
  push:
    branches: [deveopment]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: edumate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edumate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches backend/.env.example and docker-compose.yml
      DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/edumate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Keep this aligned with backend/Dockerfile (python:3.11-slim)
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Byte-compile backend sources
        run: >
          python -m compileall -q
          -x "(^|[/\\])(venv|__pycache__)([/\\]|$)"
          backend

      - name: Verify PostgreSQL connectivity
        run: |
          python test_db.py
          python test_conn.py

      - name: Run backend tests
        run: |
          # The backend does not have a committed test suite yet. Keep this
          # step explicit so it does not fail noisily, and pick up tests
          # automatically once they are added under backend/.
          if find backend -type f -name 'test_*.py' -not -path '*/venv/*' | grep -q .; then
            python -m pip install pytest
            python -m pytest backend -v
          else
            echo "::notice title=Backend tests skipped::No backend test suite is configured yet. Add tests under backend/ to enable this step."
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client

    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Next.js 16 requires Node.js >= 20.9
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The repository has pre-existing ESLint and TypeScript failures.
      # These checks are advisory until that baseline is cleaned up, so CI
      # fails only on real regressions in the steps that are enforced today.
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      - name: Run frontend tests
        run: |
          # client/package.json currently has no "test" script. Skip
          # explicitly instead of calling a command that does not exist.
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "::notice title=Frontend tests skipped::client/package.json does not define a \"test\" script yet."
          fi

      - name: Build (advisory)
        continue-on-error: true
        run: npm run build
