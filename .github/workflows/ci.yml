name: EduMate CI

# The repository's default branch is currently spelled "deveopment".
# Pull requests are validated regardless of their target branch.
on:
  push:
    branches: [deveopment]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: edumate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edumate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches backend/.env.example and docker-compose.yml
      DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/edumate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Keep this aligned with backend/Dockerfile (python:3.11-slim)
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt includes the runtime requirements plus pytest.
          pip install -r backend/requirements-dev.txt

      - name: Byte-compile backend sources
        # Keep the exclusion pattern in single quotes: inside double quotes
        # Bash collapses "\\" to "\", which leaves Python with an invalid
        # character class ("unterminated character set").
        run: >
          python -m compileall -q
          -x '(^|[/\\])(\.venv|venv|__pycache__)([/\\]|$)'
          backend

      - name: Verify PostgreSQL connectivity
        run: |
          python test_db.py
          python test_conn.py

      - name: Run backend tests
        run: |
          # Test suite lives in backend/tests (see pytest.ini). It runs against
          # an isolated SQLite database so it does not depend on the Postgres
          # service; the connectivity checks above cover real PostgreSQL.
          python -m pytest -v --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client

    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Next.js 16 requires Node.js >= 20.9
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The repository has pre-existing ESLint and TypeScript failures.
      # These checks are advisory until that baseline is cleaned up, so CI
      # fails only on real regressions in the steps that are enforced today.
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      - name: Run frontend tests
        # Unit tests use Vitest; see the Testing section in client/README.md.
        run: npm test

      - name: Build (advisory)
        continue-on-error: true
        run: npm run build
