name: EduMate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile backend/main.py || exit 1
          find backend -name "*.py" -not -path "*/venv/*" -not -path "*/__pycache__/*" -exec python -m py_compile {} \;

      - name: Run backend tests
        run: |
          python -m pytest backend/ -v --tb=short 2>/dev/null || python -m unittest discover backend -v 2>/dev/null || echo "No test framework configured"

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      #- name: Run lint checks (temporarily non-blocking)
      #  run: npm run lint -- --max-warnings=1000 || true

      - name: Run frontend tests
        run: npm test -- --watchAll=false

      - name: Verify Next.js production build
        run: npm run build

  database:
    name: Database Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: edumate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]" psycopg2-binary sqlalchemy

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i)"
            sleep 1
          done

      - name: Run database setup
        run: |
          python test_db.py
          python test_conn.py

      - name: Run environment checks
        run: |
          python test_env.py